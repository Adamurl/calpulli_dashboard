<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <title>Password recovery checks</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 24px;
    }
    iframe {
      width: 1100px;
      height: 800px;
      border: 1px solid #ddd;
    }
    li {
      margin: 8px 0;
    }
  </style>
  <h1>Password recovery browser checks</h1>
  <p>
    Use the fictional Auth fixture on port 5182 and the test-only Vite server on
    port 5175. No real users or emails are used.
  </p>
  <button id="run">Run recovery checks</button>
  <h2 id="status">Ready</h2>
  <ol id="results"></ol>
  <iframe id="app" title="Recovery page under test"></iframe>
  <script type="module">
    const frame = document.querySelector("#app");
    const doc = () => frame.contentDocument;
    const text = () => doc()?.body.innerText ?? "";
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    async function until(fn, label) {
      for (let i = 0; i < 100; i++) {
        if (fn()) return;
        await wait(100);
      }
      throw Error("Timed out: " + label);
    }
    let passed = 0;
    function check(ok, label) {
      if (!ok) throw Error(label);
      passed++;
      const li = document.createElement("li");
      li.textContent = "PASS · " + label;
      document.querySelector("#results").append(li);
    }
    async function load(path) {
      await new Promise((resolve) => {
        frame.onload = resolve;
        const target = new URL(path, location.origin);
        target.searchParams.set("browsercheck", crypto.randomUUID());
        frame.src = target.href;
      });
      await until(() => doc()?.querySelector("h1"), "page heading");
    }
    function fill(label, value) {
      const input = [...doc().querySelectorAll("input")].find((input) =>
        input.labels?.[0]?.textContent.includes(label),
      );
      if (!input) throw Error("Missing field " + label);
      Object.getOwnPropertyDescriptor(
        frame.contentWindow.HTMLInputElement.prototype,
        "value",
      ).set.call(input, value);
      input.dispatchEvent(
        new frame.contentWindow.Event("input", { bubbles: true }),
      );
    }
    async function click(label) {
      const control = [...doc().querySelectorAll("button,a")].find(
        (b) => b.textContent.trim() === label,
      );
      if (!control) throw Error("Missing control " + label);
      control.click();
      await wait(150);
    }
    const events = async () =>
      (await fetch("http://127.0.0.1:5182/_test/events")).json();
    function recovery(
      path = "/reset-password",
      signature = "fictional-recovery",
    ) {
      const encode = (value) =>
        btoa(JSON.stringify(value))
          .replaceAll("=", "")
          .replaceAll("+", "-")
          .replaceAll("/", "_");
      const exp = Math.floor(Date.now() / 1000) + 3600;
      const token = `${encode({ alg: "HS256", typ: "JWT" })}.${encode({ sub: "11111111-1111-4111-8111-111111111111", exp, aud: "authenticated", role: "authenticated" })}.${signature}`;
      return `${path}#access_token=${token}&refresh_token=fictional-refresh-token&expires_in=3600&expires_at=${exp}&token_type=bearer&type=recovery`;
    }
    document.querySelector("#run").onclick = async () => {
      document.querySelector("#run").disabled = true;
      document.querySelector("#results").innerHTML = "";
      passed = 0;
      const staffStorageKey = "sb-127-auth-token";
      const previousStaffSession = localStorage.getItem(staffStorageKey);
      const token = new URLSearchParams(recovery().split("#")[1]).get(
        "access_token",
      );
      const staffSession = JSON.stringify({
        access_token: token,
        refresh_token: "fictional-staff-refresh",
        token_type: "bearer",
        expires_in: 3600,
        expires_at: Math.floor(Date.now() / 1000) + 3600,
        user: {
          id: "11111111-1111-4111-8111-111111111111",
          email: "staff@example.org",
          aud: "authenticated",
          role: "authenticated",
        },
      });
      localStorage.setItem(staffStorageKey, staffSession);
      try {
        await load("/reset-password");
        await until(() => !text().includes("Checking"), "direct visit denied");
        check(
          doc().querySelectorAll('input[type="password"]').length === 0,
          "Direct visit with an existing staff session cannot set a password",
        );
        await load(
          "/reset-password#error=access_denied&error_code=otp_expired&error_description=Expired",
        );
        await until(() => !text().includes("Checking"), "expired link denied");
        check(
          !doc().querySelector('input[type="password"]'),
          "Expired email link cannot set a password",
        );
        await load(recovery("/reset-password", "invalid-signature"));
        await until(() => !text().includes("Checking"), "invalid token denied");
        check(
          !doc().querySelector('input[type="password"]'),
          "Supabase rejection blocks forged recovery tokens",
        );
        const before = (await events()).filter(
          (e) => e.kind === "update",
        ).length;
        await load(recovery());
        await until(
          () => doc().querySelector('input[type="password"]'),
          "verified recovery form",
        );
        check(
          !doc().querySelector(".login-background"),
          "Recovery form has no photograph",
        );
        check(
          !frame.contentWindow.location.hash &&
            frame.contentWindow.location.pathname === "/reset-password",
          "Recovery credentials are removed from the URL",
        );
        fill("New password", "FictionalPassword123!");
        fill("Confirm", "DifferentPassword123!");
        await click("Update password");
        check(
          text().toLowerCase().includes("match"),
          "Password mismatch is explained",
        );
        check(
          (await events()).filter((e) => e.kind === "update").length === before,
          "Mismatched passwords never reach Supabase",
        );
        fill("New password", "RejectedPassword123!");
        fill("Confirm", "RejectedPassword123!");
        await click("Update password");
        check(
          Boolean(doc().querySelector('[role="alert"]')),
          "Supabase password rejection shows an error",
        );
        fill("New password", "FictionalPassword123!");
        fill("Confirm", "FictionalPassword123!");
        await click("Update password");
        await until(
          () => text().toLowerCase().includes("password updated"),
          "successful reset",
        );
        check(
          !doc().querySelector('input[type="password"]'),
          "Successful reset clears the password form",
        );
        check(
          (await events()).some(
            (e) => e.kind === "logout" && e.scope === "local",
          ),
          "Recovery session signs out locally after success",
        );
        check(
          localStorage.getItem(staffStorageKey) === staffSession,
          "Recovery leaves the stored staff session unchanged",
        );
        await load("/reset-password");
        await until(
          () => !text().includes("Checking"),
          "recovery refresh denied",
        );
        check(
          !doc().querySelector('input[type="password"]'),
          "Recovery session is not persisted for later direct visits",
        );
        await load(recovery("/"));
        await until(
          () => doc().querySelector('input[type="password"]'),
          "dashboard recovery link",
        );
        check(
          frame.contentWindow.location.pathname === "/reset-password",
          "Dashboard recovery links at the root open the reset page",
        );
        frame.style.width = "390px";
        await wait(100);
        check(
          doc().documentElement.scrollWidth <= 390,
          "Reset form fits mobile width",
        );
        await load("/forgot-password");
        fill("Email", "fictional@example.org");
        await click("Send reset link");
        await until(
          () => text().toLowerCase().includes("if an account exists"),
          "email request confirmation",
        );
        check(
          (await events()).some(
            (e) =>
              e.kind === "recover" &&
              e.redirect === location.origin + "/reset-password",
          ),
          "Email requests use the current origin reset URL",
        );
        check(
          !text().includes("fictional@example.org"),
          "Confirmation does not disclose account existence",
        );
        await load("/forgot-password");
        fill("Email", "limited@example.org");
        await click("Send reset link");
        check(
          Boolean(doc().querySelector('[role="alert"]')),
          "Rate limiting leaves a recoverable error",
        );
        document.querySelector("#status").textContent =
          `${passed} recovery checks passed`;
        document.title = `${passed} recovery checks passed`;
      } catch (error) {
        document.querySelector("#status").textContent =
          `${passed} passed; FAIL: ${error.message}`;
      } finally {
        if (previousStaffSession === null)
          localStorage.removeItem(staffStorageKey);
        else localStorage.setItem(staffStorageKey, previousStaffSession);
        document.querySelector("#run").disabled = false;
      }
    };
  </script>
</html>
