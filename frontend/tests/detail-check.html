<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Presentation detail loading checks</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 20px;
    }
    iframe {
      width: 1280px;
      height: 850px;
      border: 1px solid #ccc;
    }
    .pass {
      color: #28632d;
    }
    .fail {
      color: #a00;
    }
    li {
      margin: 8px 0;
    }
  </style>
  <h1>Presentation detail loading checks</h1>
  <p>
    Fictional Auth and API responses only. No business data is read or changed.
  </p>
  <button id="run">Run detail checks</button>
  <section id="results" aria-live="polite">Ready.</section>
  <iframe id="app" title="Presentation detail under test"></iframe>
  <script type="module">
    const frame = document.querySelector("#app"),
      results = document.querySelector("#results");
    const id = "11111111-1111-4111-8111-111111111111",
      path = `/presentations/${id}`;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const doc = () => frame.contentDocument,
      text = () => doc()?.body.innerText || "";
    const fixture = () => frame.contentWindow.fixture;
    let passed = 0,
      run = 0;
    async function until(check, label) {
      for (let attempt = 0; attempt < 150; attempt++) {
        if (check()) return;
        await wait(100);
      }
      throw Error(`Timed out: ${label}`);
    }
    function check(condition, label) {
      if (!condition) throw Error(label);
      passed++;
      const item = document.createElement("li");
      item.className = "pass";
      item.textContent = `PASS ${label}`;
      results.append(item);
    }
    async function click(name) {
      const find = () =>
        [...doc().querySelectorAll("button")].find(
          (button) => button.textContent.trim() === name,
        );
      await until(find, name);
      find().click();
      await wait(100);
    }
    async function load(parameters = "") {
      const token = String(++run);
      frame.src = `/tests/live-fixture.html?run=${token}&path=${path}&${parameters}`;
      await until(
        () => fixture()?.run === token && doc().querySelector(".live-detail"),
        "detail shell",
      );
    }
    document.querySelector("#run").onclick = async () => {
      results.textContent = "";
      passed = 0;
      try {
        await load(
          "detail-delay=1800&operations-delay=1800&activities-delay=500&email-delay=900",
        );
        check(
          Boolean(
            doc().querySelector(".presentation-skeleton[aria-busy=true]"),
          ),
          "Full presentation skeleton appears before the record",
        );
        check(
          !fixture().calls.some((call) =>
            /\/(index|statistics|operations|activities|emails)$/.test(
              call.path,
            ),
          ),
          "Cold detail opens without index, statistics, or secondary requests",
        );
        check(
          frame.contentWindow.location.pathname === path,
          "Detail has its own presentation URL",
        );
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "primary record",
        );
        check(
          text().includes("Fixture Contact") &&
            Boolean(
              doc().querySelector(
                '[aria-label="Loading operational information"]',
              ),
            ),
          "Contact and event information appear while operations are pending",
        );
        check(
          Boolean(doc().querySelector('[aria-label="Loading internal notes"]')),
          "Notes have an independent skeleton",
        );
        check(
          !text().includes("Reload request"),
          "Reload request button is removed",
        );
        await until(
          () => !doc().querySelector('[aria-label="Loading internal notes"]'),
          "notes complete",
        );
        check(
          Boolean(
            doc().querySelector(
              '[aria-label="Loading operational information"]',
            ),
          ),
          "Notes finish independently of operations",
        );
        await until(() => text().includes("1200.00"), "operations");
        check(
          !fixture().calls.some((call) => call.path.endsWith("/emails")),
          "Conversation history is deferred until its tab opens",
        );
        await click("Conversation thread");
        check(
          Boolean(
            doc().querySelector('[aria-label="Loading conversation history"]'),
          ),
          "Conversation displays a skeleton while loading",
        );
        await until(
          () => text().includes("No conversation history yet"),
          "conversation",
        );
        await click("Presentation details");
        await click("Conversation thread");
        check(
          fixture().calls.filter(
            (call) => call.path.endsWith("/emails") && !call.aborted,
          ).length === 1,
          "Returning to the conversation reuses the loaded history",
        );
        await click("Back to presentations");
        await until(() => doc().querySelector(".request-row"), "index");
        check(
          frame.contentWindow.location.pathname === "/presentations",
          "Back to presentations opens the index URL",
        );
        await click("Fictional Operations School");
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "reopened details",
        );
        frame.contentWindow.history.back();
        await until(() => !doc().querySelector(".live-detail"), "browser back");
        check(
          frame.contentWindow.location.pathname === "/presentations",
          "Browser Back restores the index",
        );
        frame.contentWindow.history.forward();
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "browser forward",
        );
        check(
          frame.contentWindow.location.pathname === path,
          "Browser Forward restores the presentation",
        );
        fixture().noteDelay = 2000;
        fixture().detailDelay = 0;
        const savingEditor = doc().querySelector(
          '[aria-label="Internal note"]',
        );
        Object.getOwnPropertyDescriptor(
          frame.contentWindow.HTMLTextAreaElement.prototype,
          "value",
        ).set.call(savingEditor, "Saved after leaving details");
        savingEditor.dispatchEvent(
          new frame.contentWindow.Event("input", { bubbles: true }),
        );
        await wait(100);
        const readsBeforeSave = fixture().calls.filter((call) =>
          call.path.endsWith("/index"),
        ).length;
        await click("Add note");
        await click("Back to presentations");
        await click("Fictional Operations School");
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "reopened before save finished",
        );
        check(
          fixture().detail.internal_notes !== "Saved after leaving details",
          "Presentation can reopen before its previous save finishes",
        );
        await until(
          () =>
            fixture().detail.internal_notes === "Saved after leaving details" &&
            fixture().calls.filter((call) => call.path.endsWith("/index"))
              .length > readsBeforeSave,
          "saved note invalidation",
        );
        check(
          true,
          "Leaving a pending save still refreshes the index when the save finishes",
        );
        await until(
          () => text().includes("Saved after leaving details"),
          "saved note after return",
        );
        check(
          true,
          "Returning to the presentation shows the note saved during navigation",
        );
        await load("detail-delay=1200");
        fixture().operationsFailure = true;
        await until(
          () => doc().querySelector(".detail-sections [role=alert]"),
          "operations failure",
        );
        const editor = doc().querySelector('[aria-label="Internal note"]');
        Object.getOwnPropertyDescriptor(
          frame.contentWindow.HTMLTextAreaElement.prototype,
          "value",
        ).set.call(editor, "Unsaved fixture note");
        editor.dispatchEvent(
          new frame.contentWindow.Event("input", { bubbles: true }),
        );
        fixture().operationsFailure = false;
        doc().querySelector(".detail-sections [role=alert] button").click();
        await until(() => text().includes("1200.00"), "operations retry");
        check(
          doc().querySelector('[aria-label="Internal note"]') === editor &&
            editor.value === "Unsaved fixture note",
          "Retrying operations preserves the loaded page and unsaved note",
        );
        check(
          fixture().calls.filter(
            (call) =>
              call.path === `/api/v1/presentations/${id}` && !call.aborted,
          ).length === 1,
          "Retrying operations does not refetch the presentation",
        );
        await load("detail-delay=1800");
        fixture().detailDelay = 0;
        frame.contentWindow.history.pushState(
          null,
          "",
          "/presentations/22222222-2222-4222-8222-000000000001",
        );
        frame.contentWindow.dispatchEvent(
          new frame.contentWindow.PopStateEvent("popstate"),
        );
        await until(
          () =>
            doc().querySelector(".detail-title p")?.textContent ===
            "Earlier fixture",
          "new presentation",
        );
        check(
          fixture()
            .calls.filter((call) => call.path === `/api/v1/presentations/${id}`)
            .every((call) => call.aborted),
          "Navigation cancels the previous presentation read",
        );
        frame.contentWindow.history.pushState(
          null,
          "",
          "/presentations/99999999-9999-4999-8999-999999999999",
        );
        frame.contentWindow.dispatchEvent(
          new frame.contentWindow.PopStateEvent("popstate"),
        );
        await until(
          () => text().includes("This record was not found"),
          "missing record",
        );
        check(
          !fixture().calls.some(
            (call) =>
              call.path.includes("99999999") &&
              /\/(activities|emails|operations)$/.test(call.path),
          ),
          "Missing presentations do not start secondary reads",
        );
        const signedOutToken = String(++run);
        frame.src = `/tests/live-fixture.html?run=${signedOutToken}&path=${path}&signed-out`;
        await until(
          () =>
            fixture()?.run === signedOutToken &&
            text().includes("Welcome back."),
          "signed-out detail",
        );
        check(
          new URLSearchParams(frame.contentWindow.location.search).get(
            "next",
          ) === path,
          "Signed-out deep links retain the presentation as the login destination",
        );
        fixture().signInAgain();
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "staff approval",
        );
        check(
          frame.contentWindow.location.pathname === path,
          "Approved staff return to the requested presentation",
        );
        frame.style.width = "390px";
        await load("detail-delay=1800");
        check(
          doc().documentElement.scrollWidth <= 390,
          "Presentation skeleton fits a mobile viewport",
        );
        results.insertAdjacentHTML(
          "afterbegin",
          `<h2>${passed} detail checks passed</h2>`,
        );
      } catch (error) {
        const item = document.createElement("p");
        item.className = "fail";
        item.textContent = `FAIL after ${passed} checks: ${error.message}`;
        results.append(item);
      }
    };
  </script>
</html>
