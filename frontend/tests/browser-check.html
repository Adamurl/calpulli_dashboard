<!doctype html>
<html lang="en">
  <meta charset="UTF-8" /><title>Calpulli browser checks</title
  ><style>
    body {
      font: 14px system-ui;
      margin: 20px;
      background: #f5f6f1;
      color: #283723;
    }
    #results {
      padding: 20px;
      background: white;
      border: 1px solid #d8dfcf;
      border-radius: 12px;
      max-width: 1000px;
    }
    li {
      margin: 9px 0;
    }
    .pass {
      color: #38652a;
    }
    .fail {
      color: #a22;
    }
    iframe {
      width: 1280px;
      height: 850px;
      border: 1px solid #ccc;
      margin-top: 20px;
      transform-origin: top left;
    }
    button {
      padding: 10px;
    }
  </style>
  <h1>Calpulli browser workflow checks</h1>
  <p>
    Runs against the local development preview using fictional records. This
    resets sample data in this origin.
  </p>
  <button id="run">Run browser checks</button>
  <section id="results" aria-live="polite">Ready.</section>
  <iframe id="app" title="Dashboard under test"></iframe>
  <script type="module">
    const results = document.querySelector("#results"),
      frame = document.querySelector("#app");
    let passed = 0;
    let errors = [];
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function until(fn, label) {
      for (let i = 0; i < 100; i++) {
        const result = fn();
        if (result) return result;
        await wait(100);
      }
      throw Error("Timed out: " + label);
    }
    const doc = () => frame.contentDocument;
    const text = () => doc()?.body.innerText ?? "";
    const buttons = () => [...doc().querySelectorAll("button")];
    async function click(name, exact = true) {
      const b = await until(
        () =>
          buttons().find(
            (b) =>
              (exact
                ? (b.getAttribute("aria-label") ?? b.textContent.trim()) ===
                  name
                : (b.getAttribute("aria-label") ?? b.textContent).includes(
                    name,
                  )) && b.getClientRects().length,
          ),
        "button " + name,
      );
      b.click();
      await wait(100);
    }
    async function field(label, value) {
      const input = await until(
        () =>
          [...doc().querySelectorAll("input,textarea,select")].find(
            (e) =>
              e.getAttribute("aria-label") === label ||
              e.closest("label")?.firstChild?.textContent.trim() === label,
          ),
        "field " + label,
      );
      const proto =
        input.tagName === "TEXTAREA"
          ? frame.contentWindow.HTMLTextAreaElement.prototype
          : input.tagName === "SELECT"
            ? frame.contentWindow.HTMLSelectElement.prototype
            : frame.contentWindow.HTMLInputElement.prototype;
      Object.getOwnPropertyDescriptor(proto, "value").set.call(input, value);
      input.dispatchEvent(
        new frame.contentWindow.Event(
          input.tagName === "SELECT" ? "change" : "input",
          { bubbles: true },
        ),
      );
      await wait(100);
      return input;
    }
    function check(ok, label) {
      if (!ok) throw Error(label);
      passed++;
      const li = document.createElement("li");
      li.className = "pass";
      li.textContent = "PASS · " + label;
      results.querySelector("ol").append(li);
    }
    async function load(path = "/") {
      const target = new URL(path, location.origin);
      target.searchParams.set("browsercheck", String(Date.now()));
      await new Promise((resolve) => {
        frame.onload = resolve;
        frame.src = target.href;
      });
      await until(() => text().includes("Welcome back."), "login");
      frame.contentWindow.addEventListener("error", (e) =>
        errors.push(e.message),
      );
    }
    async function enter() {
      await click("Explore demo workspace");
      await until(
        () => doc().querySelector(".page-title")?.textContent === "Home",
        "home",
      );
    }
    async function nav(page) {
      const button = await until(
        () =>
          [...doc().querySelectorAll("nav button")].find((b) =>
            b.textContent.startsWith(page),
          ),
        "nav " + page,
      );
      button.click();
      await wait(150);
    }
    document.querySelector("#run").onclick = async () => {
      passed = 0;
      errors = [];
      results.innerHTML = "<h2>Running…</h2><ol></ol>";
      document.querySelector("#run").disabled = true;
      try {
        localStorage.removeItem("calpulli-demo-v1");
        await load("/#%");
        check(
          text().includes("Welcome back.") && !doc().querySelector("nav"),
          "Malformed URL safely shows login; dashboard stays gated",
        );
        check(
          Math.abs(
            doc().querySelector(".login-panel").getBoundingClientRect().width -
              640,
          ) < 2,
          "Desktop login uses half the screen",
        );
        check(
          doc().querySelector(".login-background img").complete &&
            doc().querySelector(".login-background img").naturalWidth > 0,
          "Provided login background loads",
        );
        check(
          doc()
            .querySelector(".forgot-password")
            .getAttribute("aria-disabled") === "true" &&
            !doc().querySelector(".login-card form > button svg"),
          "Forgot password is visual only and login has no arrow",
        );
        await click("Show password");
        check(
          doc().querySelector("input[name=password]").type === "text",
          "Password visibility toggle works",
        );
        check(
          frame.contentWindow.location.pathname === "/login",
          "Anonymous root redirects to /login",
        );
        await enter();
        check(
          frame.contentWindow.location.pathname === "/" &&
            !frame.contentWindow.location.hash,
          "Home uses the root without a hash",
        );
        await nav("Presentations");
        check(
          frame.contentWindow.location.pathname === "/presentations",
          "Navigation uses clean paths",
        );
        await nav("Inbox");
        frame.contentWindow.history.back();
        await until(
          () =>
            doc().querySelector(".page-title")?.textContent === "Presentations",
          "history back",
        );
        check(
          frame.contentWindow.location.pathname === "/presentations",
          "Back restores the previous page",
        );
        frame.contentWindow.history.forward();
        await until(
          () => doc().querySelector(".page-title")?.textContent === "Inbox",
          "history forward",
        );
        check(
          frame.contentWindow.location.pathname === "/inbox",
          "Forward restores the next page",
        );
        await nav("Home");
        check(
          text().includes("fictional data") && text().includes("Alex"),
          "Demo shell has identity and sample-data disclosure",
        );
        check(
          !doc().querySelector(".brand-symbol"),
          "Provided logo replaces placeholder marks",
        );
        await click("Collapse sidebar");
        check(
          doc().querySelector(".sidebar").getBoundingClientRect().width ===
            63 &&
            doc()
              .querySelector('nav button[aria-label="Presentations"]')
              .getClientRects().length,
          "Collapsed sidebar retains navigation icons",
        );
        await nav("Presentations");
        check(
          doc().querySelectorAll("h1").length === 1 &&
            doc().querySelector("h1").textContent === "Presentations",
          "Single page title with icon",
        );
        check(
          doc().querySelector(".period-menu summary").textContent === "Today",
          "Statistics default to Today",
        );
        doc().querySelector(".period-menu summary").click();
        doc().querySelector('input[name="stats-period"][value="7"]').click();
        await wait(100);
        check(
          doc().querySelector(".period-menu summary").textContent ===
            "7 days" &&
            doc().querySelectorAll(".request-stat svg").length === 4 &&
            !doc().querySelector(".period-menu").open,
          "Seven-day selection updates statistics and closes menu",
        );
        const { inquiries: sample } = await import("/src/data.ts");
        const now = new Date();
        const start = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() - 6,
        );
        const end = new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate() + 1,
        );
        const expected = sample.filter(
          (item) =>
            new Date(item.date + "T12:00:00") >= start &&
            new Date(item.date + "T12:00:00") < end,
        ).length;
        check(
          Number(doc().querySelector(".stat-value strong").textContent) ===
            expected,
          "Statistics count actual sample event dates",
        );
        doc().querySelector(".period-menu summary").click();
        doc().querySelector('input[name="stats-period"][value="30"]').click();
        await wait(100);
        check(
          doc().querySelector(".period-menu summary").textContent ===
            "30 days" &&
            doc()
              .querySelector(".request-stat svg")
              .getAttribute("aria-label")
              .includes("last 30 days"),
          "Thirty-day selection updates chart period",
        );
        frame.style.width = "1800px";
        await wait(100);
        check(
          doc().querySelector(".list-page").getBoundingClientRect().width >
            1700,
          "Table and stats expand across wide screens",
        );
        frame.style.width = "1280px";
        check(
          parseFloat(
            frame.contentWindow.getComputedStyle(
              doc().querySelector('input[type="checkbox"]'),
            ).borderRadius,
          ) > 0,
          "Selection checkboxes have rounded corners",
        );
        await field("Rows per page", "5");
        check(
          doc().querySelectorAll("tbody tr").length === 5,
          "Table respects page size",
        );
        const firstPage = doc().querySelector("tbody tr").textContent;
        await click("Next page");
        check(
          doc().querySelector("tbody tr").textContent !== firstPage,
          "Next page shows different requests",
        );
        await click("First page");
        doc().querySelector("thead input").click();
        await wait(100);
        check(
          /5\s+of\s+\d+\s+row\(s\) selected/.test(text()),
          "Select all applies to current page",
        );
        doc().querySelector("tbody input").click();
        await wait(100);
        check(
          doc().querySelector("thead input").indeterminate,
          "Partial selection is indicated",
        );
        doc().querySelector(".column-menu summary").click();
        const organization = [
          ...doc().querySelectorAll(".column-menu label"),
        ].find((label) => label.textContent === "Organization");
        organization.querySelector("input").click();
        await wait(100);
        check(
          ![...doc().querySelectorAll("th")].some(
            (th) => th.textContent === "Organization",
          ),
          "Column visibility updates table",
        );
        organization.querySelector("input").click();
        doc().querySelector(".column-menu summary").click();
        await field("Rows per page", "10");
        await field("Search presentations", "no matching presentation");
        check(
          text().includes("No presentations found.") &&
            /Page\s+0\s+of\s+0/.test(text()),
          "Empty results have a consistent pagination state",
        );
        await field("Search presentations", "");
        frame.style.width = "390px";
        await wait(150);
        check(
          doc().documentElement.scrollWidth <= 390,
          "Mobile presentation table scrolls inside the workspace",
        );
        frame.style.width = "1280px";
        await wait(150);
        await click("Expand sidebar");
        await field("Search presentations", "Oak Valley");
        check(
          text().includes("#1048") && !text().includes("#1047"),
          "Presentation search filters client records",
        );
        await field("Search presentations", "");
        const rowDates = [...doc().querySelectorAll("tbody tr")].map((tr) =>
          new Date(tr.children[2].textContent).getTime(),
        );
        check(
          rowDates.every(
            (date, index) => index === 0 || date <= rowDates[index - 1],
          ),
          "Date descending sorts event dates",
        );
        await click("Sort by event date ascending");
        const ascending = [...doc().querySelectorAll("tbody tr")].map((tr) =>
          new Date(tr.children[2].textContent).getTime(),
        );
        check(
          ascending.every(
            (date, index) => index === 0 || date >= ascending[index - 1],
          ),
          "Date ascending sorts event dates",
        );
        await field("Search presentations", "Oak Valley");
        await click("#1048");
        check(
          text().includes("Elena Morales") && text().includes("Presentation"),
          "Request detail shows client and event context",
        );
        await field("Request status", "reviewing");
        check(
          doc()
            .querySelector(".detail-title h2")
            .textContent.includes("In review"),
          "Sample status changes update the detail heading",
        );
        await field("Internal note", "Check the indoor performance space.");
        doc().querySelector("form.note-composer").requestSubmit();
        await wait(200);
        check(
          text().includes("Check the indoor performance space."),
          "Internal note saves in request timeline",
        );
        await click("New email");
        await click("Save draft");
        check(
          text().includes("Enter a valid recipient"),
          "Empty email cannot be saved",
        );
        await field("Subject", "A presentation just for your community");
        await field(
          "Message",
          "Hello Elena,\nWe would love to learn about your celebration.",
        );
        await click("Save draft");
        check(
          !doc().querySelector("dialog"),
          "Personal email saves and closes composer",
        );
        await nav("Drafts");
        await click("A presentation just for your community", false);
        await field(
          "Message",
          "Hello Elena,\nThursday would be a lovely time to connect.",
        );
        await click("Review email");
        check(
          text().includes("It does not send an email.") &&
            text().includes("Thursday would be a lovely time"),
          "Review shows exact edited email and delivery boundary",
        );
        await click("Save for review");
        await load("/#drafts");
        await click("Explore demo workspace");
        await until(
          () => doc().querySelector(".page-title")?.textContent === "Drafts",
          "drafts restore",
        );
        await click("Needs review");
        check(
          text().includes("A presentation just for your community"),
          "Review draft persists across reload",
        );
        await nav("Templates");
        await click("Preview & personalize");
        await click("Use this template");
        check(
          doc().querySelector("textarea").value.includes("Hello Elena"),
          "Template inserts editable personalized copy",
        );
        await click("Save draft");
        const search = buttons().find(
          (b) => b.getAttribute("aria-label") === "Search workspace",
        );
        search.click();
        await wait(100);
        await field("Search workspace records", "Oak Valley");
        await click("Oak Valley Elementary", false);
        check(
          text().includes("Awaiting review") &&
            text().includes("Thursday would be a lovely time"),
          "Global search opens the client thread with saved draft history",
        );
        const before = localStorage.getItem("calpulli-demo-v1");
        check(
          before.includes("Check the indoor performance space.") &&
            before.includes("A presentation just for your community"),
          "Notes and drafts use validated browser sample storage",
        );
        frame.style.width = "390px";
        await wait(300);
        check(
          doc().documentElement.scrollWidth <= 390,
          "Mobile detail has no page-level horizontal overflow",
        );
        check(
          frame.contentWindow.getComputedStyle(doc().querySelector(".sidebar"))
            .visibility === "hidden",
          "Closed mobile sidebar is hidden from keyboard and accessibility tree",
        );
        const menu = buttons().find(
          (b) => b.getAttribute("aria-label") === "Open navigation",
        );
        menu.click();
        await wait(150);
        check(
          frame.contentWindow.getComputedStyle(doc().querySelector(".sidebar"))
            .visibility === "visible",
          "Mobile drawer opens",
        );
        await nav("Inbox");
        check(
          doc().documentElement.scrollWidth <= 390,
          "Mobile inbox has no page-level horizontal overflow",
        );
        buttons()
          .find((b) => b.getAttribute("aria-label") === "Open navigation")
          .click();
        await wait(100);
        await click("Alex", false);
        await click("Log out");
        check(
          text().includes("Welcome back.") && !doc().querySelector("nav"),
          "Account logout returns to the login boundary",
        );
        check(
          frame.contentWindow.location.pathname === "/login",
          "Logout uses /login",
        );
        for (const path of ["/inbox", "/#inbox"]) {
          await load(path);
          check(
            frame.contentWindow.location.pathname === "/login",
            "Signed-out deep link requires login: " + path,
          );
          await click("Explore demo workspace");
          await until(
            () => doc().querySelector(".page-title")?.textContent === "Inbox",
            "restore inbox",
          );
          check(
            frame.contentWindow.location.pathname === "/inbox" &&
              !frame.contentWindow.location.hash,
            "Deep link restores clean /inbox: " + path,
          );
        }
        check(errors.length === 0, "No uncaught browser errors");
        results.querySelector("h2").textContent = `${passed} checks passed`;
        document.title = `${passed} checks passed · Calpulli`;
      } catch (error) {
        const li = document.createElement("li");
        li.className = "fail";
        li.textContent = "FAIL · " + error.message;
        results.querySelector("ol").append(li);
        results.querySelector("h2").textContent =
          `${passed} passed; failure requires attention`;
        console.error(error);
      } finally {
        document.querySelector("#run").disabled = false;
      }
    };
  </script>
</html>
