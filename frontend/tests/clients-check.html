<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Clients and navigation polish checks</title>
  <style>
    body {
      font: 14px system-ui;
      margin: 20px;
    }
    iframe {
      width: 1280px;
      height: 850px;
      border: 1px solid #ccc;
    }
    .pass {
      color: #28632d;
    }
    .fail {
      color: #a00;
    }
    li {
      margin: 8px 0;
    }
  </style>
  <h1>Clients and navigation polish checks</h1>
  <p>Fictional Auth and API boundaries only. No production data changes.</p>
  <button id="run">Run clients checks</button>
  <section id="results" aria-live="polite">Ready.</section>
  <iframe id="app" title="Clients under test"></iframe>
  <script type="module">
    const frame = document.querySelector("#app"),
      results = document.querySelector("#results");
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const doc = () => frame.contentDocument;
    let passed = 0,
      run = 0;
    async function until(check, label) {
      for (let i = 0; i < 150; i++) {
        if (check()) return;
        await wait(100);
      }
      throw Error(`Timed out: ${label}`);
    }
    function check(condition, label) {
      if (!condition) throw Error(label);
      passed++;
      const item = document.createElement("li");
      item.className = "pass";
      item.textContent = `PASS ${label}`;
      results.append(item);
    }
    async function load() {
      const token = String(++run);
      frame.src = `/tests/live-fixture.html?run=${token}&path=/presentations/clients&list-delay=1800`;
      await until(
        () =>
          frame.contentWindow.fixture?.run === token &&
          doc().querySelector(".client-skeleton"),
        "client skeleton",
      );
    }
    document.querySelector("#run").onclick = async () => {
      results.textContent = "";
      passed = 0;
      try {
        await load();
        check(
          doc().querySelectorAll(".client-skeleton").length === 8,
          "Clients show eight contact-shaped placeholders",
        );
        check(
          doc()
            .querySelector('section[aria-label="Clients"]')
            .getAttribute("aria-busy") === "true" &&
            doc()
              .querySelector("[role=status]")
              .textContent.includes("Loading clients"),
          "Clients announce their loading state",
        );
        const children = [
          ...doc().querySelectorAll(".presentation-children button"),
        ];
        check(
          children.map((button) => button.textContent.trim()).join(",") ===
            "Drafts,Clients,Templates",
          "Activity is absent from the presentation submenu",
        );
        check(
          frame.contentWindow.getComputedStyle(
            doc().querySelector(".presentation-children"),
          ).borderLeftWidth === "0px",
          "Submenu vertical guide is removed",
        );
        check(
          children.every(
            (button) => button.getBoundingClientRect().height === 28,
          ) &&
            children[1].getBoundingClientRect().top ===
              children[0].getBoundingClientRect().bottom,
          "Submenu rows have compact spacing without vertical gaps",
        );
        check(
          [...doc().querySelectorAll(".client-skeleton")].every(
            (row) => row.getAttribute("aria-hidden") === "true",
          ),
          "Decorative contact placeholders are hidden from assistive technology",
        );
        const search = doc().querySelector('[aria-label="Search clients"]');
        Object.getOwnPropertyDescriptor(
          frame.contentWindow.HTMLInputElement.prototype,
          "value",
        ).set.call(search, "Fictional Operations");
        search.dispatchEvent(
          new frame.contentWindow.Event("input", { bubbles: true }),
        );
        await until(
          () =>
            doc()
              .querySelector('section[aria-label="Clients"]')
              .getAttribute("aria-busy") === "false",
          "loaded clients",
        );
        check(
          !doc().querySelector(".client-skeleton") &&
            doc().querySelectorAll(".clients-grid > button").length === 1,
          "Loading finishes with filtered contact cards",
        );
        check(
          doc().querySelector('[aria-label="Search clients"]') === search &&
            search.value === "Fictional Operations",
          "Search input and entered query survive loading",
        );
        doc().querySelector(".clients-grid > button").click();
        await until(
          () => doc().querySelector(".client-sidebar h3"),
          "client presentation",
        );
        check(
          frame.contentWindow.location.pathname ===
            "/presentations/11111111-1111-4111-8111-111111111111",
          "Client cards still open the associated presentation URL",
        );
        check(
          Boolean(
            doc().querySelector("[role=tablist] button[role=tab]:last-child"),
          ) &&
            doc().querySelector("[role=tablist] button:last-child")
              .textContent === "Activity",
          "Activity history remains available within each presentation",
        );
        frame.contentWindow.history.pushState(
          null,
          "",
          "/presentations/activity",
        );
        frame.contentWindow.dispatchEvent(
          new frame.contentWindow.PopStateEvent("popstate"),
        );
        await until(
          () => doc().querySelector(".stat-value strong"),
          "presentation statistics",
        );
        check(
          frame.contentWindow.location.pathname === "/presentations",
          "Old Activity URLs redirect to Presentations",
        );
        check(
          [...doc().querySelectorAll(".stat-copy")].every(
            (copy) =>
              Math.abs(
                copy.querySelector(".stat-label").getBoundingClientRect()
                  .right -
                  copy
                    .querySelector(".stat-value strong")
                    .getBoundingClientRect().right,
              ) < 1,
          ),
          "Main statistics numbers align to the right edge of their headings",
        );
        frame.style.width = "390px";
        await load();
        check(
          doc().documentElement.scrollWidth <= 390,
          "Client skeletons fit the mobile viewport",
        );
        results.insertAdjacentHTML(
          "afterbegin",
          `<h2>${passed} clients checks passed</h2>`,
        );
      } catch (error) {
        const item = document.createElement("p");
        item.className = "fail";
        item.textContent = `FAIL after ${passed} checks: ${error.message}`;
        results.append(item);
      }
    };
  </script>
</html>
