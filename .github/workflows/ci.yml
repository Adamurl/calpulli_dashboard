name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: calpulli
          POSTGRES_PASSWORD: ci_ephemeral_only
          POSTGRES_DB: calpulli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calpulli -d calpulli_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://calpulli:ci_ephemeral_only@localhost:5432/calpulli_ci
      TEST_DATABASE_URL: postgresql+psycopg://calpulli:ci_ephemeral_only@localhost:5432/calpulli_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrate isolated PostgreSQL database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" uv run alembic check
      - run: uv run pytest
      - name: Validate development Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose config --quiet
